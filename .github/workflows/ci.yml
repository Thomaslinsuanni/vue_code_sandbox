# ==========================================
# Vue Code Sandbox - CI Pipeline
# ==========================================
# 持續整合工作流程，確保代碼品質和建置成功
# 包含：ESLint、TypeScript、建置驗證、安全審核
# ==========================================

name: CI

# 觸發條件：推送到 main 分支或創建 PR
on:
  push:
    branches: [main] # 推送到主分支時觸發
  pull_request:
    branches: [main] # PR 到主分支時觸發

# 併發控制：同一 ref 只允許一個工作流程執行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # 取消正在進行的舊工作流程

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Check code formatting
        run: pnpm format --check

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Build preview
        run: pnpm build-preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            !dist/**/*.map
          retention-days: 7

